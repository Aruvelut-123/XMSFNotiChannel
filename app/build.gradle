plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gswxxn.xmsfnotichannel'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "com.gswxxn.xmsfnotichannel"
        minSdk 28
        targetSdk 37
        versionCode 157
        versionName "1.5.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // CI 用仓库 Secrets 注入；本地无 secrets 时该配置不生效，不会影响 debug 构建
        release {
            def ksPath = System.getenv("SIGNING_KEY_STORE_PATH")
            def ksFile = ksPath != null ? file(ksPath) : null
            if (ksFile != null && ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // 开源软件，不做混淆：保持符号完整，便于用户审计与排查问题
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有签名证书时用它签名，否则退回 debug 证书（CI 默认走 debug 证书，便于直接安装测试）
            def ksPath = System.getenv("SIGNING_KEY_STORE_PATH")
            signingConfig = (ksPath != null && file(ksPath).exists())
                ? signingConfigs.release
                : signingConfigs.debug
        }
        debug {
            // debug 包名一致，便于覆盖安装
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            merges += "META-INF/xposed/*"
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    // YukiHook（基于 libxposed API 102 的运行时）
    implementation 'com.highcapable.yukihookapi:yukihook-runtime-libxposed:1.5.0'
    // YukiHook 的 API 本体：runtime-libxposed 只在 runtime 作用域传递 core，
    // 编译期拿不到 YukiHookXposedModule 等符号，必须显式声明
    implementation 'com.highcapable.yukihookapi:yukihook-core:1.5.0'
    // libxposed API：仅编译期可见，运行时由框架注入
    compileOnly 'io.github.libxposed:api:102.0.0'
    // 框架通信（查询激活状态）
    implementation 'io.github.libxposed:service:102.0.0'

    // 突破 Android 11+ hidden API 限制（ParceledListSlice#getList、ServiceManager 等）
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.2'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}