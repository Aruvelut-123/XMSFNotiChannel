# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 使用外部 Kotlin 插件（2.4.x）；AGP 9 默认内置的 Kotlin 2.2 读不了 YukiHook 1.5.0 的 2.4 metadata
android.builtInKotlin=false
# 外部 Kotlin 插件与 AGP 9 的新 DSL 不兼容，需要回退到旧 DSL
android.newDsl=false

# aapt2 的 optimize 子命令在 build-tools 35 与 AGP 9 之间参数不兼容，
# 会导致 release 产物的 AndroidManifest/resources.arsc 丢失，因此关闭资源优化。
android.enableResourceOptimizations=false

# 若本机 aapt2（arm64 环境）不可用，可取消下面一行的注释指向可执行的 aapt2
# android.aapt2FromMavenOverride=/root/Android/build-tools/35.0.0/aapt2