name: Build Test APK

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 cmdline-tools 已移除 "tools" 包，用默认值会让 action 直接失败
          packages: 'platform-tools'

      # compileSdk 37 需要对应的 platform，buildToolsVersion 在 build.gradle 里固定为 37.0.0
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | head -1)
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          "$AAPT2" dump badging "$APK" | head -5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XMSFNotiChannel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
