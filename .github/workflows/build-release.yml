name: Build Release APK

# 打 tag（v*）或手动触发时构建 release 包，并附到 GitHub Release 上。
# 也支持在 Actions 页面手动点 Run workflow 直接出包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: '文件名后缀（留空则用 versionName）'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 cmdline-tools 已移除 "tools" 包，用默认值会让 action 直接失败
          packages: 'platform-tools'

      # compileSdk 37 需要对应 platform，buildToolsVersion 固定 37.0.0
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 签名优先用仓库 Secrets；没配置时 build.gradle 会自动退回 debug 证书
      - name: Decode signing keystore
        if: ${{ secrets.SIGNING_KEY_STORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          SIGNING_KEY_STORE_PATH: ${{ secrets.SIGNING_KEY_STORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/release/
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | head -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$AAPT2" dump badging "$APK" | head -5
          echo "=== META-INF/xposed ==="
          unzip -l "$APK" | grep -i 'META-INF/xposed' || true

      - name: Rename artifact
        id: rename
        run: |
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          NAME="XMSFNotiChannel-release${SUFFIX:+-$SUFFIX}.apk"
          cp "$APK" "app/build/outputs/apk/release/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "renamed to $NAME"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: XMSFNotiChannel-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/${{ steps.rename.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: |
            build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7